name: Persistent RDP (72h Auto-Restore & Same IP/Password)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'  # Tự chạy lại mỗi 3 ngày (72 tiếng)

jobs:
  rdp-server:
    runs-on: windows-latest
    timeout-minutes: 4320 # 72h

    steps:
      - name: 🔹 Enable RDP Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService

      - name: 🔹 Create or Restore RDP User
        run: |
          Add-Type -AssemblyName System.Security
          $passPath = "C:\backup\rdp-pass.txt"
          if (Test-Path $passPath) {
            $password = Get-Content $passPath
            Write-Host "🔁 Reusing existing RDP password."
          } else {
            $chars = ([char[]](33..126))
            $password = -join (1..16 | ForEach-Object { $chars | Get-Random })
            New-Item -ItemType File -Path $passPath -Force | Out-Null
            Set-Content -Path $passPath -Value $password
            Write-Host "🔐 Created new password and saved for reuse."
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $securePass -FullName "RDP User" -Description "Persistent RDP account"
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
            Write-Host "✅ Created local user 'RDP'."
          } else {
            # ensure password is set/updated
            $u = Get-LocalUser -Name "RDP"
            $u | Set-LocalUser -Password $securePass
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
            Write-Host "♻️ Updated existing user 'RDP' password and ensured RD group membership."
          }

      - name: 🧹 Cleanup: Free disk space & reduce lag (report before/after)
        run: |
          Write-Host "=== Disk space BEFORE cleanup ==="
          Get-PSDrive -Name C | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}}, @{n='UsedGB';e={[math]::Round(($_.Used)/1GB,2)}} | Format-List

          Write-Host "`n>>> STOP and DISABLE some non-essential services (may improve responsiveness)"
          # SysMain (Superfetch) can cause IO on some machines; disable to reduce background IO.
          if (Get-Service -Name "SysMain" -ErrorAction SilentlyContinue) {
            Stop-Service -Name "SysMain" -Force -ErrorAction SilentlyContinue
            Set-Service -Name "SysMain" -StartupType Disabled
            Write-Host " - SysMain stopped & disabled."
          }

          # Optionally disable Windows Search (comment/uncomment if you want)
          # Stop-Service -Name "WSearch" -Force -ErrorAction SilentlyContinue
          # Set-Service -Name "WSearch" -StartupType Disabled

          Write-Host "`n>>> Clear temporary files (Windows temp, user temp, recycle bin, explorer thumbnail cache)"
          Try {
            # Windows temp
            Get-ChildItem -Path 'C:\Windows\Temp' -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
            # All users temp
            $userTempPaths = Get-ChildItem -Path C:\Users -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Join-Path $_.FullName "AppData\Local\Temp"
            }
            foreach ($p in $userTempPaths) {
              if (Test-Path $p) {
                Get-ChildItem -Path $p -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
              }
            }
            Clear-RecycleBin -Force -ErrorAction SilentlyContinue
            # Explorer thumbnail cache
            $thumbPath = "$env:localappdata\Microsoft\Windows\Explorer"
            Get-ChildItem $thumbPath -Filter "*thumbcache*" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
            Write-Host " - Temp, recycle bin, thumbnails cleared."
          } Catch {
            Write-Warning "Could not fully clear some temp paths: $_"
          }

          Write-Host "`n>>> Turn off hibernation to remove hiberfil.sys (frees large space)"
          Try {
            powercfg -h off
            Write-Host " - Hibernation disabled (hiberfile removed)."
          } Catch {
            Write-Warning " - Failed to run powercfg -h off: $_"
          }

          Write-Host "`n>>> DISM / Component cleanup (will reduce WinSxS size). This can be slow."
          # StartComponentCleanup is non-destructive and safe. ResetBase is optional but more permanent and prevents uninstalling updates.
          Start-Process -FilePath dism.exe -ArgumentList "/Online","/Cleanup-Image","/StartComponentCleanup" -Wait -NoNewWindow
          # Optionally uncomment ResetBase if you want to permanently remove the ability to uninstall updates (more space, irreversible)
          # Start-Process -FilePath dism.exe -ArgumentList "/Online","/Cleanup-Image","/StartComponentCleanup","/ResetBase" -Wait -NoNewWindow

          Write-Host "`n>>> Remove Windows.old if present (if you are sure)"
          if (Test-Path "C:\Windows.old") {
            Try {
              Remove-Item -Path "C:\Windows.old" -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host " - Removed C:\Windows.old"
            } Catch {
              Write-Warning " - Could not remove Windows.old: $_"
            }
          }

          Write-Host "`n>>> Trim / Optimize volume (for SSDs) and defrag for HDDs"
          Try {
            Optimize-Volume -DriveLetter C -ReTrim -Verbose -ErrorAction SilentlyContinue
            Optimize-Volume -DriveLetter C -Defrag -Verbose -ErrorAction SilentlyContinue
            Write-Host " - Optimize-Volume executed."
          } Catch {
            Write-Warning " - Optimize-Volume failed or not applicable: $_"
          }

          Write-Host "`n>>> Set Visual Effects to 'Adjust for best performance' (reduces UI lag on low-resource machines)"
          Try {
            # 2 = Adjust for best performance
            New-Item -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects -Force | Out-Null
            Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2 -Type DWord -Force
            Write-Host " - VisualFXSetting set to 2 (best performance)."
          } Catch {
            Write-Warning " - Could not set VisualFXSetting: $_"
          }

          Write-Host "`n>>> Set power plan to High performance (reduces latency)"
          Try {
            # SCHEME_MIN = High Performance GUID might differ; use alias
            powercfg /SETACTIVE SCHEME_MIN
            Write-Host " - Power plan set to High performance (if available)."
          } Catch {
            Write-Warning " - Could not set power plan: $_"
          }

          Write-Host "`n>>> Report disk space AFTER cleanup"
          Get-PSDrive -Name C | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}}, @{n='UsedGB';e={[math]::Round(($_.Used)/1GB,2)}} | Format-List

          Write-Host "`n✅ Cleanup step completed. Note: some operations (DISM ResetBase, powercfg changes) may require a reboot to fully apply."
